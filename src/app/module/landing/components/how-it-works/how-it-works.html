<section class="how-it-works">
  <div class="how-it-works__header">
    <span class="how-it-works__eyebrow">Comment ça marche</span>
    <p class="how-it-works__subtitle">De votre question a la resolution, sans friction</p>
  </div>

  <div class="how-it-works__grid">
    <div class="how-it-works__card" *ngFor="let step of steps">
      <div class="how-it-works__icon-wrap">
        <ng-container [ngSwitch]="step.icon">
          <svg *ngSwitchCase="'search'" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="11" cy="11" r="7" stroke="white" stroke-width="2"/>
            <path d="M16.5 16.5L21 21" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <svg *ngSwitchCase="'handshake'" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 13l4 4 3-3 4 4 5-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9 7l2 2 4-4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <svg *ngSwitchCase="'video'" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="2" y="6" width="14" height="12" rx="2" stroke="white" stroke-width="2"/>
            <path d="M16 10l6-3v10l-6-3V10z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
          </svg>
          <svg *ngSwitchCase="'shield'" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3L4 7v5c0 4.418 3.358 8.563 8 9.93C17.642 20.563 21 16.418 21 12V7l-9-4z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
            <path d="M9 12l2 2 4-4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </ng-container>
      </div>
      <h3 class="how-it-works__card-title">{{ step.title }}</h3>
      <p class="how-it-works__card-desc">{{ step.description }}</p>
    </div>
  </div>
</section>
