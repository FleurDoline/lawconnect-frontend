<div class="modal-backdrop" *ngIf="isOpen" (click)="closeOnBackdrop($event)">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">

    <div class="modal__header">
      <div class="modal__header-left">
        <div class="modal__icon">
          <svg viewBox="0 0 20 20" fill="none" width="18" height="18" aria-hidden="true">
            <circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.6"/>
            <path d="M13 13l3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <h2 id="modal-title" class="modal__title">Trouver votre avocat</h2>
          <p class="modal__subtitle">Décrivez votre besoin pour un matching précis</p>
        </div>
      </div>
      <button class="modal__close" (click)="close()" aria-label="Fermer">
        <svg viewBox="0 0 20 20" fill="none" width="14" height="14" aria-hidden="true">
          <path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="modal__badges">
      <span class="badge badge--gold">
        <span class="badge__dot"></span>
        Avocats vérifiés
      </span>
      <span class="badge badge--muted">180 experts disponibles</span>
    </div>

    <div class="modal__body">

      <div class="field">
     <label class="field__label">Spécialité juridique</label>
     <div class="chips">
    <button
      *ngFor="let s of specialites"
      class="chip"
      [class.chip--selected]="isSelected(s.value)"
      (click)="toggleSpecialite(s.value)"
      type="button"
    >
      {{ s.label }}
    </button>
  </div>
</div>

      <div class="field-row">
        <div class="field">
          <label class="field__label" for="ville">Ville</label>
          <select id="ville" [(ngModel)]="selectedVille" class="field__select">
            <option value="">Sélectionner...</option>
            <option *ngFor="let v of villes" [value]="v">{{ v }}</option>
          </select>
        </div>
        <div class="field">
          <label class="field__label" for="type">Type de besoin</label>
          <select id="type" [(ngModel)]="selectedType" class="field__select">
            <option value="">Sélectionner...</option>
            <option *ngFor="let t of types" [value]="t">{{ t }}</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="description">
          Décrivez brièvement votre situation
          <span class="field__optional">(optionnel)</span>
        </label>
        <textarea
          id="description"
          [(ngModel)]="description"
          class="field__textarea"
          rows="3"
          placeholder="Ex : Mon employeur souhaite mettre fin à mon contrat sans motif valable..."
        ></textarea>
      </div>

      <button class="btn-search" (click)="rechercher()" type="button">
        <svg viewBox="0 0 20 20" fill="none" width="16" height="16" aria-hidden="true">
          <circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.6"/>
          <path d="M13 13l3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        Trouver mon avocat
        <svg viewBox="0 0 20 20" fill="none" width="15" height="15" aria-hidden="true">
          <path d="M4 10h12M11 5l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <p class="modal__note">
        <svg viewBox="0 0 20 20" fill="none" width="12" height="12" aria-hidden="true" style="vertical-align: -1px;">
          <rect x="4" y="9" width="12" height="9" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M7 9V6a3 3 0 116 0v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Vous serez invité à créer un compte pour accéder aux résultats
      </p>

    </div>
  </div>
</div>
