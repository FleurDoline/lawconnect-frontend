<section class="domaines-page">
  <div class="domaines-page__top">
    <a routerLink="/" class="domaines-page__back">&larr; Retour à l'accueil</a>
  </div>

  <div class="domaines-page__header">
    <span class="domain__eyebrow">Domaine de droit</span>
    <h1 class="domaines-page__title">Tous nos domaines d'expertise</h1>
    <p class="domain__subtitle">Une expertise pour chaque situation</p>
  </div>

  <div class="domaines-page__grid">
    <div class="domain__card" *ngFor="let item of allDomaines">
      <div class="domain__icon-wrap">
        <ng-container [ngTemplateOutlet]="iconTpl" [ngTemplateOutletContext]="{ icon: item.icon }"></ng-container>
      </div>
      <div class="domaine__card-content">
        <h3 class="domaine__card-title">{{ item.title }}</h3>
        <p class="domaine__card-desc">{{ item.description }}</p>
      </div>
    </div>
  </div>
</section>

<ng-template #iconTpl let-icon="icon">
  <ng-container [ngSwitch]="icon">
    <svg *ngSwitchCase="'family'" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="9" cy="7" r="2.5" stroke="#1a2b4b" stroke-width="1.8"/>
      <circle cx="17" cy="7" r="2" stroke="#1a2b4b" stroke-width="1.8"/>
      <path d="M3 19c0-3.314 2.686-6 6-6s6 2.686 6 6" stroke="#1a2b4b" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M17 13c1.657 0 3 1.343 3 3v2" stroke="#1a2b4b" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <svg *ngSwitchCase="'building'" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="3" y="10" width="18" height="11" rx="1.5" stroke="#1a2b4b" stroke-width="1.8"/>
      <path d="M7 10V7a5 5 0 0110 0v3" stroke="#1a2b4b" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M9 21v-4h6v4" stroke="#1a2b4b" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <svg *ngSwitchCase="'penal'" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 3L4 7v5c0 4.418 3.358 8.563 8 9.93C17.642 20.563 21 16.418 21 12V7l-9-4z" stroke="#1a2b4b" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M9 12l2 2 4-4" stroke="#1a2b4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <svg *ngSwitchCase="'commercial'" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="2" y="7" width="20" height="14" rx="1.5" stroke="#1a2b4b" stroke-width="1.8"/>
      <path d="M16 7V5a4 4 0 00-8 0v2" stroke="#1a2b4b" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M12 12v4M10 14h4" stroke="#1a2b4b" stroke-width="1.8" stroke-linecap="round"/>
    </svg>

    <!-- Droit du Travail: briefcase with a clock (career/hours) -->
    <svg *ngSwitchCase="'travail'" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="3" y="8" width="18" height="12" rx="1.5" stroke="#1a2b4b" stroke-width="1.8"/>
      <path d="M8 8V6a2 2 0 012-2h4a2 2 0 012 2v2" stroke="#1a2b4b" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="12" cy="14" r="2.6" stroke="#1a2b4b" stroke-width="1.6"/>
      <path d="M12 12.8v1.3l.9.6" stroke="#1a2b4b" stroke-width="1.4" stroke-linecap="round"/>
    </svg>

    <!-- Divorce: broken ring -->
    <svg *ngSwitchCase="'divorce'" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M8 14a4 4 0 117.2-2.4" stroke="#1a2b4b" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M16 10a4 4 0 01-7.2 2.4" stroke="#1a2b4b" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M11.2 5.5L9.5 8M13 15.8L14.7 18.3" stroke="#1a2b4b" stroke-width="1.8" stroke-linecap="round"/>
    </svg>

    <!-- Droit des Étrangers: passport/globe -->
    <svg *ngSwitchCase="'etrangers'" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="12" cy="12" r="8.5" stroke="#1a2b4b" stroke-width="1.8"/>
      <ellipse cx="12" cy="12" rx="3.6" ry="8.5" stroke="#1a2b4b" stroke-width="1.6"/>
      <path d="M3.5 12h17" stroke="#1a2b4b" stroke-width="1.6"/>
    </svg>

    <!-- Droit Social: two people / handshake -->
    <svg *ngSwitchCase="'social'" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="8" cy="8" r="2.3" stroke="#1a2b4b" stroke-width="1.8"/>
      <circle cx="16" cy="8" r="2.3" stroke="#1a2b4b" stroke-width="1.8"/>
      <path d="M4 19c0-2.8 1.8-5 4-5s4 2.2 4 5" stroke="#1a2b4b" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M12 19c0-2.8 1.8-5 4-5s4 2.2 4 5" stroke="#1a2b4b" stroke-width="1.8" stroke-linecap="round"/>
    </svg>

    <!-- Immigration: plane/departure -->
    <svg *ngSwitchCase="'immigration'" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M3 15l7-2 4-8 2 .6-2.4 7.4 5.4-1.5.6 1.9-6 3.2-1 3.4-1.6-.4.4-3.2-6.4 1.6-1-1.4 3-1.4z" stroke="#1a2b4b" stroke-width="1.4" stroke-linejoin="round"/>
    </svg>

    <!-- Droit de la Santé: medical cross in shield -->
    <svg *ngSwitchCase="'sante'" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 3l7 3v5c0 4.4-3 7.5-7 9-4-1.5-7-4.6-7-9V6l7-3z" stroke="#1a2b4b" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M12 9v6M9 12h6" stroke="#1a2b4b" stroke-width="1.8" stroke-linecap="round"/>
    </svg>

    <!-- Violences Conjugales: shield with alert -->
    <svg *ngSwitchCase="'violences'" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 3l7 3v5c0 4.4-3 7.5-7 9-4-1.5-7-4.6-7-9V6l7-3z" stroke="#1a2b4b" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M12 8v4.5" stroke="#1a2b4b" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="12" cy="15.2" r="0.9" fill="#1a2b4b"/>
    </svg>

    <!-- Accident de la Route: car -->
    <svg *ngSwitchCase="'accident'" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M4 16v-3.5L6 8h12l2 4.5V16" stroke="#1a2b4b" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M4 16h16v2H4z" stroke="#1a2b4b" stroke-width="1.4"/>
      <circle cx="7.5" cy="18.3" r="1.3" stroke="#1a2b4b" stroke-width="1.5"/>
      <circle cx="16.5" cy="18.3" r="1.3" stroke="#1a2b4b" stroke-width="1.5"/>
      <path d="M8 8l1.5-3h5L16 8" stroke="#1a2b4b" stroke-width="1.5" stroke-linecap="round"/>
    </svg>

    <!-- Autre: question mark -->
    <svg *ngSwitchDefault viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="12" cy="12" r="8.5" stroke="#1a2b4b" stroke-width="1.8"/>
      <path d="M9.5 9.5a2.5 2.5 0 014.8 1c0 1.6-2.3 1.8-2.3 3.5" stroke="#1a2b4b" stroke-width="1.7" stroke-linecap="round"/>
      <circle cx="12" cy="17" r="0.9" fill="#1a2b4b"/>
    </svg>
  </ng-container>
</ng-template>
