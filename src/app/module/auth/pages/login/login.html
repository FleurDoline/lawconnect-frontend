<div class="auth-page">
  <div class="auth-layout">

    <!-- Left panel -->
    <div class="auth-layout__left">
      <div class="auth-layout__left-content">
        <span class="auth-layout__brand">LawConnect</span>
        <h1 class="auth-layout__tagline">
          La justice<br>est la&nbsp; vérité<br>
          <span class="auth-layout__tagline--accent">en action</span>
        </h1>
        <p class="auth-layout__quote">
          « Là où finit la loi, commence la tyrannie. » Construisons
          ensemble un espace où le droit reste accessible,
          transparent et humain.
        </p>
      </div>
    </div>

    <!-- Right panel -->
    <div class="auth-layout__right">
      <div class="auth-card">
        <p class="auth-card__eyebrow">BON RETOUR</p>
        <h2 class="auth-card__title">Connectez-vous</h2>

        <!-- Toggle -->
        <div class="auth-toggle">
          <button class="auth-toggle__btn auth-toggle__btn--active">Connexion</button>
          <button class="auth-toggle__btn" routerLink="/auth/inscription">Inscription</button>
        </div>

        <!-- Form -->
        <form class="auth-form" (ngSubmit)="onSubmit()">
          <div class="form-group">
            <label class="form-label">Email</label>
            <input
              class="form-input"
              type="email"
              placeholder=""
              [(ngModel)]="email"
              name="email"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label">Mot de passe</label>
            <div class="form-input-wrapper">
              <input
                class="form-input"
                [type]="showPassword ? 'text' : 'password'"
                placeholder=""
                [(ngModel)]="password"
                name="password"
                required
              />
              <button type="button" class="form-input-eye" (click)="togglePassword()">
                <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-row">
            <label class="form-check">
              <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" />
              <span>Se souvenir de moi</span>
            </label>
            <a class="form-link" routerLink="/auth/mot-de-passe-oublie">Mot de passe oublié?</a>
          </div>

          <button type="submit" class="btn-primary" [disabled]="loading">
            {{ loading ? 'Connexion...' : 'Se connecter' }}
          </button>

          <div class="auth-or"><span>or</span></div>

          <div id="googleBtn" style="display: flex; justify-content: center;"></div>
        </form>

        <p class="auth-card__footer">
          Pas de compte? <a routerLink="/auth/inscription" class="auth-card__footer-link">Sign up</a>
        </p>

        <a class="auth-card__back" routerLink="/">← Retour à l'accueil</a>
      </div>
    </div>

  </div>
</div>
