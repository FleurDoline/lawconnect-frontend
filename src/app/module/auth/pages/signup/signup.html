<div class="auth-page">
<div class="auth-layout">

  <!-- Left panel -->
  <div class="auth-layout__left">
    <div class="auth-layout__left-content">
      <span class="auth-layout__brand">LawConnect</span>
      <h1 class="auth-layout__tagline">
        La justice<br>est la&nbsp; vérité<br>
        <span class="auth-layout__tagline--accent">en action</span>
      </h1>
      <p class="auth-layout__quote">
        « Là où finit la loi, commence la tyrannie. » Construisons
        ensemble un espace où le droit reste accessible,
        transparent et humain.
      </p>
    </div>
  </div>

  <!-- Right panel -->
  <div class="auth-layout__right">
    <div class="auth-card">
      <p class="auth-card__eyebrow">NOUVEAU COMPTE</p>
      <h2 class="auth-card__title">Créez votre compte</h2>

      <!-- Toggle -->
      <div class="auth-toggle">
        <button class="auth-toggle__btn" routerLink="/auth/login">Connexion</button>
        <button class="auth-toggle__btn auth-toggle__btn--active">Inscription</button>
      </div>

      <!-- Role toggle 
      <div class="form-group" *ngIf="!roleLockedByUrl">
        <label class="form-label">Je m'inscris en tant que</label>
        <div class="form-row-double">
          <button type="button"
                  class="role-toggle-btn"
                  [class.role-toggle-btn--active]="role === 'CLIENT'"
                  (click)="role = 'CLIENT'">
            Client
          </button>
          <button type="button"
                  class="role-toggle-btn"
                  [class.role-toggle-btn--active]="role === 'AVOCAT'"
                  (click)="role = 'AVOCAT'">
            Avocat
          </button>
        </div>
      </div>  -->

      <!-- Form -->
      <form class="auth-form" (ngSubmit)="onSubmit()" #signupForm="ngForm">
        <!-- First Name / Last Name -->
        <div class="form-row-double">
          <div class="form-group">
            <label class="form-label">Prénom</label>
            <input
              class="form-input"
              type="text"
              placeholder=""
              [(ngModel)]="prenom"
              name="prenom"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label">Nom</label>
            <input
              class="form-input"
              type="text"
              placeholder=""
              [(ngModel)]="nom"
              name="nom"
              required
            />
          </div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label class="form-label">Email</label>
          <input
            class="form-input"
            type="email"
            placeholder=""
            [(ngModel)]="email"
            name="email"
            required
            email
          />
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label">Mot de passe</label>
          <div class="form-input-wrapper">
            <input
              class="form-input"
              [type]="showPassword ? 'text' : 'password'"
              placeholder=""
              [(ngModel)]="password"
              name="password"
              required
              minlength="6"
            />
            <button type="button" class="form-input-eye" (click)="togglePassword()">
              <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                   viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                   viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label class="form-label">Confirmer mot de passe</label>
          <input
            class="form-input"
            type="password"
            placeholder=""
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            required
          />
        </div>

        <!-- Terms -->
        <div class="form-row">
          <label class="form-check">
            <input type="checkbox" [(ngModel)]="acceptTerms" name="acceptTerms" />
            <span>J'accepte les <a href="#" class="form-link">conditions d'utilisation</a></span>
          </label>
        </div>

        <p class="auth-form__error" *ngIf="errorMessage">
           {{ errorMessage }}
        </p>


        <!-- Submit Button -->
        <button type="submit" class="btn-primary" [disabled]="loading || !acceptTerms">
          {{ loading ? 'Création en cours...' : 'Créer mon compte' }}
        </button>

        <!-- OR Divider -->
        <div class="auth-or"><span>ou</span></div>

        <!-- Google Signup -->
        <div id="googleBtn" style="display: flex; justify-content: center; min-height: 44px;"></div>
      </form>

      <!-- Footer -->
      <p class="auth-card__footer">
        Déjà un compte? <a (click)="goToLogin()" class="auth-card__footer-link">Se connecter</a>
      </p>

      <!-- Back to Home -->
      <a class="auth-card__back" (click)="goToHome()">← Retour à l'accueil</a>
    </div>
  </div>
</div>
</div>
