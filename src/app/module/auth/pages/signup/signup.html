<div class="auth-page">
<div class="auth-layout">

  <!-- Left panel -->
  <div class="auth-layout__left">
    <div class="auth-layout__left-content">
      <span class="auth-layout__brand">LawConnect</span>
      <h1 class="auth-layout__tagline">
        La justice<br>est la&nbsp; vérité<br>
        <span class="auth-layout__tagline--accent">en action</span>
      </h1>
      <p class="auth-layout__quote">
        « Là où finit la loi, commence la tyrannie. » Construisons
        ensemble un espace où le droit reste accessible,
        transparent et humain.
      </p>
    </div>
  </div>

  <!-- Right panel -->
  <div class="auth-layout__right">
    <div class="auth-card">
      <p class="auth-card__eyebrow">NOUVEAU COMPTE</p>
      <h2 class="auth-card__title">Créez votre compte</h2>

      <!-- Toggle -->
      <div class="auth-toggle">
        <button class="auth-toggle__btn" routerLink="/auth/login">Connexion</button>
        <button class="auth-toggle__btn auth-toggle__btn--active">Inscription</button>
      </div>

      <!-- Form -->
      <form class="auth-form" (ngSubmit)="onSubmit()" #signupForm="ngForm">
        <!-- First Name / Last Name -->
        <div class="form-row-double">
          <div class="form-group">
            <label class="form-label">Prénom</label>
            <input
              class="form-input"
              type="text"
              placeholder=""
              [(ngModel)]="prenom"
              name="prenom"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label">Nom</label>
            <input
              class="form-input"
              type="text"
              placeholder=""
              [(ngModel)]="nom"
              name="nom"
              required
            />
          </div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label class="form-label">Email</label>
          <input
            class="form-input"
            type="email"
            placeholder=""
            [(ngModel)]="email"
            name="email"
            required
            email
          />
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label">Mot de passe</label>
          <div class="form-input-wrapper">
            <input
              class="form-input"
              [type]="showPassword ? 'text' : 'password'"
              placeholder=""
              [(ngModel)]="password"
              name="password"
              required
              minlength="6"
            />
            <button type="button" class="form-input-eye" (click)="togglePassword()">
              <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                   viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                   viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label class="form-label">Confirmer mot de passe</label>
          <input
            class="form-input"
            type="password"
            placeholder=""
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            required
          />
        </div>

        <!-- Terms -->
        <div class="form-row">
          <label class="form-check">
            <input type="checkbox" [(ngModel)]="acceptTerms" name="acceptTerms" />
            <span>J'accepte les <a href="#" class="form-link">conditions d'utilisation</a></span>
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-primary" [disabled]="loading || !acceptTerms">
          {{ loading ? 'Création en cours...' : 'Créer mon compte' }}
        </button>

        <!-- OR Divider -->
        <div class="auth-or"><span>ou</span></div>

        <!-- Google Signup -->
        <button type="button" class="btn-google" (click)="onGoogleSignup()">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          Continuer avec Google
        </button>
      </form>

      <!-- Footer -->
      <p class="auth-card__footer">
        Déjà un compte? <a (click)="goToLogin()" class="auth-card__footer-link">Se connecter</a>
      </p>

      <!-- Back to Home -->
      <a class="auth-card__back" (click)="goToHome()">← Retour à l'accueil</a>
    </div>
  </div>
</div>
</div>
