<section class="domain">
  <div class="domain__header">
    <div class="domain__header-left">
      <span class="domain__eyebrow">Domaine de droit</span>
      <p class="domain__subtitle">Une expertise pour chaque situation</p>
    </div>
    <a class="domain__link" routerLink="/domaines">Voir tous les domaines</a>
  </div>

  <div class="domain__grid">
    <div
      class="domain__card"
      *ngFor="let item of domaines"
      (click)="goToAvocatsByDomaine(item)"
      role="button"
      tabindex="0"
      (keyup.enter)="goToAvocatsByDomaine(item)"
    >
      <div class="domain__icon-wrap">
        <ng-container [ngSwitch]="item.icon">
          <svg *ngSwitchCase="'family'" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="9" cy="7" r="2.5" stroke="#1a2b4b" stroke-width="1.8"/>
            <circle cx="17" cy="7" r="2" stroke="#1a2b4b" stroke-width="1.8"/>
            <path d="M3 19c0-3.314 2.686-6 6-6s6 2.686 6 6" stroke="#1a2b4b" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M17 13c1.657 0 3 1.343 3 3v2" stroke="#1a2b4b" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <svg *ngSwitchCase="'building'" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="10" width="18" height="11" rx="1.5" stroke="#1a2b4b" stroke-width="1.8"/>
            <path d="M7 10V7a5 5 0 0110 0v3" stroke="#1a2b4b" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M9 21v-4h6v4" stroke="#1a2b4b" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <svg *ngSwitchCase="'penal'" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3L4 7v5c0 4.418 3.358 8.563 8 9.93C17.642 20.563 21 16.418 21 12V7l-9-4z" stroke="#1a2b4b" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M9 12l2 2 4-4" stroke="#1a2b4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <svg *ngSwitchCase="'commercial'" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="2" y="7" width="20" height="14" rx="1.5" stroke="#1a2b4b" stroke-width="1.8"/>
            <path d="M16 7V5a4 4 0 00-8 0v2" stroke="#1a2b4b" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M12 12v4M10 14h4" stroke="#1a2b4b" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </ng-container>
      </div>
      <div class="domaine__card-content">
        <h3 class="domaine__card-title">{{ item.title }}</h3>
        <p class="domaine__card-desc">{{ item.description }}</p>
      </div>
    </div>
  </div>
</section>
